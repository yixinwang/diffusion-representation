[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diq-fm"
version = "0.1.0"
description = "Nonlinear drift-innovation quotient flow matching"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0", "scipy>=1.12", "pandas>=2.0", "scikit-learn>=1.4",
  "matplotlib>=3.8", "torch>=2.2", "scikit-image>=0.22"
]

[tool.setuptools.packages.find]
where = ["src"]
