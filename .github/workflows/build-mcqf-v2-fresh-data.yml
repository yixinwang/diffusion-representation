name: build-mcqf-v2-fresh-data
on:
  push:
    branches: [agent/mcqf-v2-data-20260827]
    paths:
      - .github/workflows/build-mcqf-v2-fresh-data.yml
      - data_build/mcqf_v2/build_fresh_data.py
      - data_build/mcqf_v2/cifar_v1_exclusions.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned preprocessing stack
        run: python -m pip install 'datasets==4.0.0' 'huggingface_hub==0.34.4' 'opencv-python-headless==4.11.0.86' 'numpy==2.2.6'
      - name: Build and verify fresh nonoverlapping data
        run: |
          python data_build/mcqf_v2/build_fresh_data.py
          cd build/out
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mcqf-v2-fresh-cifar-ucf
          path: build/out/
          retention-days: 5
          compression-level: 6
          if-no-files-found: error
