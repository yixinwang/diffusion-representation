name: build-rmpf-genuine-data
on:
  push:
    branches: [agent/rmpf-genuine-data-20260828]
    paths:
      - .github/workflows/build-rmpf-genuine-data.yml
      - data_build/rmpf_genuine/build_data.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned preprocessing stack
        run: python -m pip install 'datasets==4.0.0' 'huggingface_hub==0.34.4' 'opencv-python-headless==4.11.0.86' 'numpy==2.2.6' 'Pillow==11.3.0' 'av==14.4.0'
      - name: Build and verify data
        run: |
          python data_build/rmpf_genuine/build_data.py
          cd build/out
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rmpf-genuine-cifar32-hmdb32
          path: build/out/
          retention-days: 5
          compression-level: 6
          if-no-files-found: error
