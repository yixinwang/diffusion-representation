[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiqfm"
version = "0.1.0"
description = "Static Flow-Induced Quotient Flow Matching research implementation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "torch>=2.1",
  "matplotlib>=3.8",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
